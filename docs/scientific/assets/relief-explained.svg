<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280"><rect width="960" height="280" rx="12" fill="#eef0e6"/><title>Construction du relief</title><text x="30" y="35" font-family="system-ui" font-size="16" fill="#304c41">1. Bruit et surrection</text><g transform="translate(20,60)"><polygon points="0,165 0,125 35,110 65,80 100,90 135,40 170,70 205,55 245,105 280,115 280,165" fill="#c3b28a"/><polyline points="0,125 35,110 65,80 100,90 135,40 170,70 205,55 245,105 280,115" fill="none" stroke="#617b58" stroke-width="3"/></g><text x="350" y="35" font-family="system-ui" font-size="16" fill="#304c41">2. Drainage et incision</text><g transform="translate(340,60)"><polygon points="0,165 0,125 35,115 65,80 100,125 135,40 170,105 205,55 245,115 280,125 280,165" fill="#c3b28a"/><polyline points="0,125 35,115 65,80 100,125 135,40 170,105 205,55 245,115 280,125" fill="none" stroke="#617b58" stroke-width="3"/><path d="M100 125L145 158L205 165" fill="none" stroke="#5996ac" stroke-width="4"/></g><text x="670" y="35" font-family="system-ui" font-size="16" fill="#304c41">3. Détail de surface</text><g transform="translate(660,60)"><polygon points="0,165 0,125 20,116 35,120 65,75 80,92 100,125 120,68 135,40 150,80 170,105 190,68 205,55 225,98 245,115 280,125 280,165" fill="#c3b28a"/><polyline points="0,125 20,116 35,120 65,75 80,92 100,125 120,68 135,40 150,80 170,105 190,68 205,55 225,98 245,115 280,125" fill="none" stroke="#617b58" stroke-width="3"/><path d="M100 125L145 158L205 165" fill="none" stroke="#5996ac" stroke-width="4"/></g><text x="30" y="260" font-family="system-ui" font-size="12" fill="#526559">Les passes régionales structurent les vallées ; les bandes fines enrichissent la surface.</text></svg>