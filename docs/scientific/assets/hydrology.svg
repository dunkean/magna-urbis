<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 390" role="img" aria-labelledby="title desc"><title id="title">Dépression, lac et seuil</title><desc id="desc">Le sol forme une cuvette. L'apport du bassin alimente le lac, l'évaporation retire de l'eau et un débordement n'existe qu'au seuil. Le potentiel de drainage est distinct de l'altitude physique.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#3b6c85"/></marker><style>text{font-family:system-ui,sans-serif;fill:#283c31;font-size:17px}.small{font-size:14px;fill:#5c6c60}.arrow{stroke:#3b6c85;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs><rect width="1100" height="390" rx="8" fill="#f3f4ed"/><path d="M50 135 180 175 325 294 480 326 650 285 785 212 870 240 1050 315V355H50Z" fill="#d9d7b9"/><path d="M225 212H785L650 285 480 326 325 294Z" fill="#bdd9dc"/><path d="M50 135 180 175 325 294 480 326 650 285 785 212 870 240 1050 315" fill="none" stroke="#8b8e68" stroke-width="3"/><path d="M175 212H850" stroke="#377c96" stroke-dasharray="7 6" stroke-width="2"/><text x="65" y="70">Apports du bassin</text><path class="arrow" d="M110 86 179 144 250 190"/><text x="420" y="62">Évaporation sur l’aire du lac</text><path class="arrow" d="M500 181V82"/><path class="arrow" d="M565 181V102"/><text x="800" y="155">Seuil / exutoire</text><path class="arrow" d="M830 162 788 201"/><text class="small" x="829" y="191">débordement si atteint</text><path class="arrow" d="M800 219 860 245 938 277"/><text x="383" y="255">Lac à un niveau commun</text><text class="small" x="67" y="368">Sol physique</text><text class="small" x="386" y="368">Cuvette retenue</text><text class="small" x="775" y="368">Vers le réseau aval</text></svg>
