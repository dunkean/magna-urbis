<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" role="img" aria-labelledby="title desc"><title id="title">The three urban budgets</title><desc id="desc">Demand, land capacity and actually produced capacity are distinct quantities. Refusals do not count as built capacity.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#466953"/></marker><style>text{font-family:system-ui,sans-serif;fill:#263b30;font-size:16px}.head{font-size:20px;font-weight:650}.sub{font-size:14px;fill:#5b6b5e}.box{fill:#e9eee3;stroke:#a7b69e;stroke-width:1.5}</style></defs><rect width="1100" height="320" rx="8" fill="#f3f4ed"/><g text-anchor="middle"><rect class="box" x="35" y="45" width="300" height="168" rx="7"/><text class="head" x="185" y="82">1 · Demand</text><text x="185" y="115">Population and functions</text><text class="sub" x="185" y="146">domestic units, workshops,</text><text class="sub" x="185" y="170">storage, market, commons…</text><rect class="box" x="400" y="45" width="300" height="168" rx="7"/><text class="head" x="550" y="82">2 · Admissible land</text><text x="550" y="115">Parcels and reservations</text><text class="sub" x="550" y="146">area, access, native witness</text><text class="sub" x="550" y="170">≠ completed buildings</text><rect class="box" x="765" y="45" width="300" height="168" rx="7"/><text class="head" x="915" y="82">3 · Realised capacity</text><text x="915" y="115">Accepted results</text><text class="sub" x="915" y="146">built and open kept separate</text><text class="sub" x="915" y="170">refusals retained in the deficit</text><path d="M335 127H399M700 127H764" stroke="#466953" stroke-width="2" marker-end="url(#a)"/><text x="550" y="269">Compare demand and actual production using the same unit and function.</text><text class="sub" x="550" y="295">A coloured area, drawn lot or visible roof does not, by itself, represent a housed household.</text></g></svg>
