<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 570" role="img" aria-labelledby="title desc"><title id="title">Dépendances de la génération</title><desc id="desc">Deux sources de relief convergent vers la surface retenue. L'eau et les implantations précèdent les routes et la ville. Programme, parcelles et maisons se réconcilient avant le rendu.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#466953"/></marker><style>text{font-family:system-ui,sans-serif;fill:#263b30;font-size:17px}.small{font-size:13px;fill:#5a6a5e}.box{fill:#e9eee3;stroke:#a7b69e;stroke-width:1.5}.line{fill:none;stroke:#466953;stroke-width:1.7;marker-end:url(#a)}.title{font-weight:650}</style></defs><rect width="1100" height="570" rx="8" fill="#f3f4ed"/>
<g text-anchor="middle"><rect class="box" x="85" y="25" width="390" height="66" rx="7"/><text class="title" x="280" y="53">Relief procédural</text><text class="small" x="280" y="75">graine · motifs · érosion · côte</text><rect class="box" x="625" y="25" width="390" height="66" rx="7"/><text class="title" x="820" y="53">Relief neuronal / import</text><text class="small" x="820" y="75">esquisse · climat · poids · reconstruction</text><path class="line" d="M280 91V110H550V133"/><path class="line" d="M820 91V110H550"/>
<rect class="box" x="355" y="134" width="390" height="56" rx="7"/><text class="title" x="550" y="168">Surface physique retenue</text><path class="line" d="M550 190V206H280V222"/>
<rect class="box" x="85" y="223" width="390" height="62" rx="7"/><text class="title" x="280" y="249">Hydrologie</text><text class="small" x="280" y="271">drainage · bassins · eau · lits</text><rect class="box" x="625" y="223" width="390" height="62" rx="7"/><text class="title" x="820" y="249">Implantations → routes</text><text class="small" x="820" y="271">site · emprise utile · graphe régional</text><path class="line" d="M475 254H624"/><path class="line" d="M820 285V316H220V338"/>
<rect class="box" x="85" y="339" width="270" height="73" rx="7"/><text class="title" x="220" y="369">Quartiers &amp; îlots</text><text class="small" x="220" y="393">emprise · phases · rues</text><rect class="box" x="415" y="339" width="270" height="73" rx="7"/><text class="title" x="550" y="369">Programme &amp; parcelles</text><text class="small" x="550" y="393">réserves · accès · allocation</text><rect class="box" x="745" y="339" width="270" height="73" rx="7"/><text class="title" x="880" y="369">Maisons admises</text><text class="small" x="880" y="393">plans · sol · accès · toits</text><path class="line" d="M355 375H414"/><path class="line" d="M685 375H744"/><path d="M880 412V450H550V414" class="line"/><text class="small" x="717" y="443">bâti / ouvert / refus / déficit</text>
<rect x="85" y="486" width="930" height="57" rx="7" fill="#315b48"/><text x="550" y="520" style="fill:#fff">Rendu · caméra · styles · scènes et exports appliqués</text><path class="line" d="M220 412V485"/><path class="line" d="M880 450V485"/></g></svg>
