  <div id="boot-splash" role="status" aria-live="polite">
    <img src="./assets/app-icon-256-Dco99YJ7.webp" alt="" width="128" height="128">
    <strong>MAGNA URBIS</strong>
    <p id="boot-message">Preparing the workshop…</p>
    <div class="boot-progress" aria-hidden="true"></div>
    <noscript>
      <h1>Fantasy and historical map and city generator</h1>
      <p>Magna Urbis generates regions, rivers and towns down to streets, parcels and buildings, in 2D and 3D, across many historical and fantasy cultures. The workshop needs JavaScript and WebAssembly.</p>
      <p><a href="https://magna-urbis.org/gallery/v2/">Gallery</a> · <a href="https://github.com/dunkean/magna-urbis/releases">Desktop app (Windows, Linux)</a> · <a href="https://v1.magna-urbis.org/">Magna Urbis V1</a></p>
    </noscript>
  </div>
  <script>
    (()=>{
      let french=false;
      try{french=(new URLSearchParams(location.search).get('lang')||localStorage.getItem('magna-urbis-v2-language'))==='fr';}catch{}
      const message=document.getElementById('boot-message');
      if(french)message.textContent='Préparation de l’atelier…';
      // Each ?lang= page is its own canonical, matching the hreflang alternates.
      try{
        const lang=new URLSearchParams(location.search).get('lang');
        if(lang&&lang!=='en'&&document.querySelector(`link[hreflang="${CSS.escape(lang)}"]`)){
          const href='https://magna-urbis.org/?lang='+lang;
          document.querySelector('link[rel="canonical"]')?.setAttribute('href',href);
          document.querySelector('meta[property="og:url"]')?.setAttribute('content',href);
        }
      }catch{}
      window.addEventListener('error',event=>{
        if(!(event instanceof ErrorEvent))return;
        if(!document.getElementById('boot-splash'))return;
        message.textContent=french?'Le chargement a échoué. Rechargez l’application pour réessayer.':'Loading failed. Reload the application to try again.';
        document.querySelector('#boot-splash .boot-progress')?.remove();
      });
    })();
  </script>
  <div id="app"></div>
