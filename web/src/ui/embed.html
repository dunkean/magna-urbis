<!doctype html>
<html lang="en" data-state="loading">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Magna Urbis · City preview</title>
    <link rel="stylesheet" href="./city-embed.css" />
  </head>
  <body>
    <div id="map" tabindex="0" aria-label="City map: drag to pan, scroll to zoom"></div>
    <div id="status">
      <span id="progress-label" role="status" data-embed-text>Generating city…</span>
      <progress id="city-progress" aria-labelledby="progress-label" max="7"></progress>
    </div>
    <div id="caption"><strong id="burg-name" hidden></strong></div>
    <div id="demo-controls" hidden>
      <button id="randomize" type="button" class="icon" data-icon="dice" aria-label="Randomize culture, population, geography and buildings"></button>
      <form id="population-form">
        <label for="preview-population" data-embed-text>Population</label>
        <input id="preview-population" type="number" min="1" max="5000000" step="1" required />
        <button type="submit" class="icon" data-icon="apply" aria-label="Apply"></button>
      </form>
      <span id="demo-params"></span>
    </div>
    <div id="detail-actions" class="rail" role="group" aria-label="Map views">
      <button id="plan" type="button" class="icon" data-icon="plan" aria-label="City plan" aria-pressed="false" disabled></button>
      <button id="detailed" type="button" class="icon stars" aria-label="Satellite · Fast" aria-pressed="false" disabled>★</button>
      <button id="painted" type="button" class="icon stars" aria-label="Painted satellite" aria-pressed="false" disabled>★★</button>
      <button id="expand-preview" type="button" class="icon" data-icon="expand" aria-label="Enlarge" aria-expanded="false" hidden></button>
    </div>
    <div id="map-navigation" class="rail" role="group" aria-label="Navigation">
      <button id="zoom-in" type="button" class="icon navigation-icon" data-icon="plus" disabled aria-label="Zoom in"></button>
      <button id="zoom-out" type="button" class="icon navigation-icon" data-icon="minus" disabled aria-label="Zoom out"></button>
      <button id="fit-view" type="button" class="icon navigation-icon" data-icon="compass" disabled aria-label="Recenter city"></button>
    </div>
    <button id="houses" type="button" class="icon" data-icon="houses" aria-label="Architectural houses" disabled></button>
    <a id="open" target="_blank" rel="noopener" aria-label="Open in Magna Urbis ↗">magna-urbis</a>
    <script type="module" src="../v2/cityEmbed.ts"></script>
  </body>
</html>
