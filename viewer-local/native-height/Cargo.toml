[package]
name = "magna-surface-height-batch"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"

# Isolated helper: ordinary web, terrain and Godot builds do not pull this in.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"

