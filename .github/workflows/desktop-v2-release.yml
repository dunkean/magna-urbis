name: Desktop V2 release

on:
  workflow_dispatch:
    inputs:
      target:
        description: Desktop platforms to build and test
        type: choice
        default: desktop
        options:
          - desktop
          - macos-arm64
          - macos-arm64-hardware
  push:
    tags: ['desktop-v*']

permissions:
  contents: read
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(
        inputs.target == 'macos-arm64-hardware' && '{"include":[{"os":["self-hosted","macOS","ARM64","magna-desktop"],"platform":"macos-arm64","bundles":"dmg"}]}' ||
        inputs.target == 'macos-arm64' && '{"include":[{"os":"macos-15","platform":"macos-arm64","bundles":"dmg"}]}' ||
        '{"include":[{"os":"windows-2022","platform":"windows-x64","bundles":"nsis"},{"os":"ubuntu-22.04","platform":"linux-x64","bundles":"deb,appimage"},{"os":"macos-15","platform":"macos-arm64","bundles":"dmg"}]}'
        ) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check desktop version and release tag
        run: node web/scripts/v2_version.mjs --check
      - name: Check Apple Silicon toolchain
        if: matrix.platform == 'macos-arm64'
        run: |
          test "$(uname -m)" = arm64
          test "$(node -p process.arch)" = arm64
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf fuse xvfb
      - name: Install Rust toolchain and wasm-pack
        working-directory: rust
        run: cargo install wasm-pack --version 0.13.1 --locked
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Fetch pinned shared GPU engine source
        shell: bash
        run: |
          revision=$(node -p "require('./rust/models/neural-earth/desktop-profile.json').engineSourceRevision")
          git init ../infinite_map
          git -C ../infinite_map remote add origin https://github.com/dunkean/neural-earth.git
          git -C ../infinite_map sparse-checkout init --cone
          git -C ../infinite_map sparse-checkout set native/neural-earth tools/wasm
          git -C ../infinite_map fetch --depth 1 --filter=blob:none origin "$revision"
          git -C ../infinite_map checkout --detach FETCH_HEAD
      - name: Restore macOS engines for this source
        if: matrix.platform == 'macos-arm64'
        id: mac-engines
        uses: actions/cache/restore@v4
        with:
          path: |
            rust/pkg/wasm
            rust/pkg/houses
            rust/pkg/neural-web
            rust/target/release/magna-urbis-local
            rust/target/release/magna-urbis-neural
          key: macos-arm64-engines-v1-${{ hashFiles('rust/crates/**', 'rust/Cargo.*', 'rust/rust-toolchain.toml', 'rust/.cargo/**', 'rust/scripts/**', 'rust/models/neural-earth/**', 'web/scripts/v2.mjs', 'web/scripts/neural_wasm.mjs', 'web/package-lock.json') }}
      # The desktop app generates with the native Rust engine and its WebView is not cross-origin
      # isolated, so the WASM threads package (web deploy only) would never load there.
      - name: Prepare WASM
        if: matrix.platform != 'macos-arm64' || steps.mac-engines.outputs.cache-hit != 'true'
        timeout-minutes: 30
        working-directory: web
        run: npm run prepare:v2 -- --no-threads
      - name: Build desktop installers and both native engines
        if: matrix.platform != 'macos-arm64'
        working-directory: web
        run: npm run app:v2:build -- --bundles=${{ matrix.bundles }}
      - name: Build both Apple Silicon native engines and resources
        if: matrix.platform == 'macos-arm64' && steps.mac-engines.outputs.cache-hit != 'true'
        timeout-minutes: 30
        working-directory: web
        run: npm run prepare:v2:desktop
      - name: Save the verified source's macOS engine outputs
        if: matrix.platform == 'macos-arm64' && steps.mac-engines.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            rust/pkg/wasm
            rust/pkg/houses
            rust/pkg/neural-web
            rust/target/release/magna-urbis-local
            rust/target/release/magna-urbis-neural
          key: ${{ steps.mac-engines.outputs.cache-primary-key }}
      - name: Build Apple Silicon DMG
        if: matrix.platform == 'macos-arm64'
        timeout-minutes: 30
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          MAGNA_LOCAL_BIN: ${{ github.workspace }}/rust/target/release/magna-urbis-local
        working-directory: web
        run: npm run app:v2:build -- --no-build --bundles=dmg --features=desktop-smoke --config='{"bundle":{"macOS":{"signingIdentity":"-"}}}'
      - uses: actions/setup-python@v5
        if: matrix.platform != 'macos-arm64'
        with:
          python-version: '3.12'
      - name: Check optional runtime and model tooling
        if: matrix.platform != 'macos-arm64'
        shell: bash
        run: |
          python -m unittest discover -s python_runtime -p "test_*.py"
          python -m unittest discover -s docs/models-release -p "test_*.py"
      - name: Test native service inputs and verified download handling
        if: matrix.platform != 'macos-arm64'
        working-directory: rust
        shell: bash
        run: |
          cargo test --locked --release --manifest-path crates/neural-native/Cargo.toml --target-dir target
          cargo test --locked --release --manifest-path desktop-v2/Cargo.toml
      - name: Check portable archive creation and packaged Windows app
        if: runner.os == 'Windows'
        working-directory: web
        shell: bash
        run: |
          node scripts/v2_portable_test.mjs
          node scripts/v2_desktop_check.mjs
      - name: Recreate and verify neural model release assets
        if: runner.os == 'Linux'
        run: node web/scripts/v2_neural_release.mjs
      - name: Check resources and stage release assets
        run: node web/scripts/v2_release_check.mjs --platform=${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-v2-${{ matrix.platform }}
          path: release-v2/${{ matrix.platform }}/
          if-no-files-found: error
      - name: Prepare verified neural weights for the macOS smoke test
        if: matrix.platform == 'macos-arm64'
        run: node web/scripts/v2_neural_release.mjs --output="${RUNNER_TEMP}/magna-macos-weights"
      - name: Run the installed app in WKWebView
        if: matrix.platform == 'macos-arm64'
        timeout-minutes: 12
        env:
          MAGNA_REQUIRE_MAC_GPU: ${{ inputs.target == 'macos-arm64-hardware' && '1' || '0' }}
        run: |
          cd release-v2/macos-arm64
          shasum -a 256 -c SHA256SUMS-macos-arm64.txt
          node ../../web/scripts/v2_macos_check.mjs ./*.dmg "${RUNNER_TEMP}/magna-macos-weights"
      - name: Typecheck and test V2 integrations
        env:
          NODE_OPTIONS: ${{ matrix.platform == 'macos-arm64' && '--max-old-space-size=4096' || '' }}
        working-directory: web
        shell: bash
        run: |
          node --test scripts/neural_manifest.test.mjs
          node scripts/v2_release_check_test.mjs
          npm run typecheck
          npx vitest run tests/v2Illustration.test.ts tests/v2Platform.test.ts tests/v2PythonRuntimeSelection.test.ts tests/v2DesktopUpdates.test.ts tests/v2/desktopNeural.test.ts tests/neuralModels.test.ts
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: desktop-v2-neural-models
          path: release-v2/models/
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-v2
          merge-multiple: true
      - name: Verify all published checksums
        working-directory: release-v2
        run: |
          sha256sum -c SHA256SUMS-windows-x64.txt
          sha256sum -c SHA256SUMS-linux-x64.txt
          sha256sum -c SHA256SUMS-macos-arm64.txt
          sha256sum -c SHA256SUMS-neural-models.txt
      - name: Stage draft then publish alpha with verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" release-v2/* --verify-tag --draft --prerelease \
            --title "Magna Urbis V2 Alpha — $RELEASE_TAG" \
            --generate-notes --notes-file docs/DESKTOP_RELEASE_NOTES.md
          gh release edit "$RELEASE_TAG" --draft=false --prerelease
