<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 570" role="img" aria-labelledby="title desc"><title id="title">Generation dependencies</title><desc id="desc">Two terrain sources converge on the retained surface. Water and settlement placement precede roads and town plans. Programme, parcels and houses are reconciled before rendering.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#466953"/></marker><style>text{font-family:system-ui,sans-serif;fill:#263b30;font-size:17px}.small{font-size:13px;fill:#5a6a5e}.box{fill:#e9eee3;stroke:#a7b69e;stroke-width:1.5}.line{fill:none;stroke:#466953;stroke-width:1.7;marker-end:url(#a)}.title{font-weight:650}</style></defs><rect width="1100" height="570" rx="8" fill="#f3f4ed"/>
<g text-anchor="middle"><rect class="box" x="85" y="25" width="390" height="66" rx="7"/><text class="title" x="280" y="53">Procedural terrain</text><text class="small" x="280" y="75">seed · motifs · erosion · coast</text><rect class="box" x="625" y="25" width="390" height="66" rx="7"/><text class="title" x="820" y="53">Neural terrain / import</text><text class="small" x="820" y="75">sketch · climate · weights · reconstruction</text><path class="line" d="M280 91V110H550V133"/><path class="line" d="M820 91V110H550"/>
<rect class="box" x="355" y="134" width="390" height="56" rx="7"/><text class="title" x="550" y="168">Retained physical surface</text><path class="line" d="M550 190V206H280V222"/>
<rect class="box" x="85" y="223" width="390" height="62" rx="7"/><text class="title" x="280" y="249">Hydrology</text><text class="small" x="280" y="271">drainage · basins · water · beds</text><rect class="box" x="625" y="223" width="390" height="62" rx="7"/><text class="title" x="820" y="249">Placement → roads</text><text class="small" x="820" y="271">site · usable footprint · regional graph</text><path class="line" d="M475 254H624"/><path class="line" d="M820 285V316H220V338"/>
<rect class="box" x="85" y="339" width="270" height="73" rx="7"/><text class="title" x="220" y="369">Quarters &amp; blocks</text><text class="small" x="220" y="393">footprint · phases · streets</text><rect class="box" x="415" y="339" width="270" height="73" rx="7"/><text class="title" x="550" y="369">Programme &amp; parcels</text><text class="small" x="550" y="393">reserves · access · allocation</text><rect class="box" x="745" y="339" width="270" height="73" rx="7"/><text class="title" x="880" y="369">Accepted houses</text><text class="small" x="880" y="393">plans · ground · access · roofs</text><path class="line" d="M355 375H414"/><path class="line" d="M685 375H744"/><path d="M880 412V450H550V414" class="line"/><text class="small" x="717" y="443">built / open / refusals / deficit</text>
<rect x="85" y="486" width="930" height="57" rx="7" fill="#315b48"/><text x="550" y="520" style="fill:#fff">Rendering · camera · styles · applied scenes and exports</text><path class="line" d="M220 412V485"/><path class="line" d="M880 450V485"/></g></svg>
