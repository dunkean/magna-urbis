<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" role="img" aria-labelledby="title desc"><title id="title">Cadastre, access and containment</title><desc id="desc">Street contact serves a parcel. The building stays inside the buildable envelope and avoids holes. A refused rectangle crosses an exclusion.</desc><defs><pattern id="h" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2 2-2M0 8 8 0M6 10 10 6" stroke="#b7a082" stroke-width="1"/></pattern><style>text{font-family:system-ui,sans-serif;fill:#283c31;font-size:17px}.small{font-size:14px;fill:#5b6b5e}</style></defs><rect width="1100" height="380" rx="8" fill="#f3f4ed"/><path d="M38 285H1035V339H38Z" fill="#d8cdac"/><text x="735" y="319">Retained street and actual access</text><path d="M100 63 501 45 528 285H85Z" fill="#e5e9d8" stroke="#58765c" stroke-width="2.5"/><path d="M125 87 473 72 492 263H112Z" fill="none" stroke="#789477" stroke-dasharray="6 5" stroke-width="1.5"/><path d="M131 282H322" stroke="#2c7359" stroke-width="8"/><rect x="145" y="142" width="175" height="117" fill="#9cb59c" stroke="#426c50" stroke-width="2"/><path d="M218 259V285" stroke="#4b6747" stroke-width="8"/><path d="M380 120 438 111 457 177 390 187Z" fill="url(#h)" stroke="#a18865" stroke-width="2"/><rect x="342" y="100" width="120" height="110" fill="none" stroke="#b97154" stroke-dasharray="7 5" stroke-width="2"/><path d="M346 105 458 205M458 105 346 205" stroke="#b97154" stroke-width="2"/><text x="154" y="189">Accepted building</text><path d="M498 50H590" stroke="#58765c"/><text x="607" y="57">Cadastral boundary</text><path d="M475 84H590" stroke="#789477" stroke-dasharray="6 5"/><text x="607" y="91">Buildable domain</text><path d="M457 158H590" stroke="#a18865"/><text x="607" y="165">Hole / retained exclusion</text><path d="M462 203H590" stroke="#b97154"/><text x="607" y="210">Refused candidate: crosses the hole</text><path d="M327 281H590" stroke="#2c7359"/><text x="607" y="282">Qualified contact, length in metres</text><text class="small" x="50" y="367">Not to scale. Access geometry and roof rights may have their own domains.</text></svg>
