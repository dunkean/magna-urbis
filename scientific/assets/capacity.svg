<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" role="img" aria-labelledby="title desc"><title id="title">Les trois budgets urbains</title><desc id="desc">Demande, capacité foncière et capacité réellement produite sont des grandeurs distinctes. Les refus ne sont pas comptés comme de la capacité bâtie.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#466953"/></marker><style>text{font-family:system-ui,sans-serif;fill:#263b30;font-size:16px}.head{font-size:20px;font-weight:650}.sub{font-size:14px;fill:#5b6b5e}.box{fill:#e9eee3;stroke:#a7b69e;stroke-width:1.5}</style></defs><rect width="1100" height="320" rx="8" fill="#f3f4ed"/><g text-anchor="middle"><rect class="box" x="35" y="45" width="300" height="168" rx="7"/><text class="head" x="185" y="82">1 · Demande</text><text x="185" y="115">Population et fonctions</text><text class="sub" x="185" y="146">unités domestiques, ateliers,</text><text class="sub" x="185" y="170">stockage, marché, communs…</text><rect class="box" x="400" y="45" width="300" height="168" rx="7"/><text class="head" x="550" y="82">2 · Foncier admissible</text><text x="550" y="115">Parcelles et réservations</text><text class="sub" x="550" y="146">surface, accès, témoin natif</text><text class="sub" x="550" y="170">≠ bâtiments réalisés</text><rect class="box" x="765" y="45" width="300" height="168" rx="7"/><text class="head" x="915" y="82">3 · Capacité réalisée</text><text x="915" y="115">Résultats admis</text><text class="sub" x="915" y="146">bâti et ouvert séparés</text><text class="sub" x="915" y="170">refus conservés au déficit</text><path d="M335 127H399M700 127H764" stroke="#466953" stroke-width="2" marker-end="url(#a)"/><text x="550" y="269">Comparer la demande et le réalisé dans la même unité et pour la même fonction.</text><text class="sub" x="550" y="295">Une aire coloriée, un lot dessiné ou un toit visible ne sont pas à eux seuls un ménage logé.</text></g></svg>
