[package]
name = "magna-urbis-desktop"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

# Optional app: ordinary web/WASM builds never pull in a native WebView.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = 3
lto = "thin"
