[workspace]
resolver = "3"
members = ["crates/core", "crates/wasm", "crates/neural", "crates/random", "crates/houses", "crates/houses-wasm", "crates/local"]
# The optional browser neural adapter uses Neural Earth's shared GPU runtime.
# Keep that build dependency out of ordinary terrain/houses builds.
exclude = ["crates/neural-wasm"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
publish = false

# Interactive prototype: optimize generated WASM even in the fast development build.
[profile.dev]
opt-level = 2

# The terrain engine and its water kernels run per camera move and per flood:
# full speed without debug checks, also in the development build.
[profile.dev.package.magna-urbis-core]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.magna-urbis-wasm]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.release]
opt-level = 3
lto = "thin"

# Browser WASM release: whole-program optimisation, single codegen unit.
# (No panic = "abort": the urban stages rely on catch_unwind around geometry kernels.)
[profile.wasm-release]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
