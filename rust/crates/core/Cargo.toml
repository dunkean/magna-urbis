[package]
name = "magna-urbis-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
magna-urbis-random = { path = "../random" }
magna-urbis-terrain = { path = "../terrain" }
serde = { version = "1", features = ["derive"] }
delaunator = "1"
geo = { version = "=0.33.1", default-features = false, features = ["earcut"] }
serde_json = "1"
# Polygon booleans of render_geometry and landuse (same pin as rust/crates/houses).
i_overlay = "=4.5.2"

# Deterministic per-quarter / per-block parallelism (urban/par.rs). wasm32 runs
# serially unless the `threads` feature is on (atomics build, wasm-bindgen-rayon pool).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.12"
[target.'cfg(target_arch = "wasm32")'.dependencies]
rayon = { version = "1.12", optional = true }

[features]
# Rayon on wasm32 (shared-memory build) for urban and terrain kernels.
# Native builds always use rayon.
threads = ["dep:rayon", "magna-urbis-terrain/threads"]

[dev-dependencies]
serde_json = "1"
