[package]
name = "magna-urbis-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
magna-urbis-random = { path = "../random" }
serde = { version = "1", features = ["derive"] }
delaunator = "1"
geo = { version = "=0.33.1", default-features = false, features = ["earcut"] }
serde_json = "1"

# Deterministic per-quarter / per-block parallelism (urban/par.rs); wasm32 runs serially.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.12"

[features]
# Parallel terrain kernels on wasm32 (needs a rayon pool on wasm threads).
threads = []

[dev-dependencies]
serde_json = "1"
