[package]
name = "magna-urbis-neural-wasm"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[workspace]
resolver = "3"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
magna-urbis-core = { path = "../core" }
neural_runtime = { package = "neural-earth-wasm", path = "../../../../infinite_map/native/neural-earth" }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[profile.release]
opt-level = 3
lto = "thin"
