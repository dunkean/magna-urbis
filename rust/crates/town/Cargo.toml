[package]
name = "magna-urbis-town"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
magna-urbis-geom = { path = "../geom" }
magna-urbis-random = { path = "../random" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Deterministic per-quarter parallelism (growth/par.rs), as in core: native builds always use
# rayon; wasm32 runs serially unless the `threads` feature is on.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.12"
[target.'cfg(target_arch = "wasm32")'.dependencies]
rayon = { version = "1.12", optional = true }

[features]
# The host selects the shared-memory WebAssembly build through this feature.
threads = ["dep:rayon"]
