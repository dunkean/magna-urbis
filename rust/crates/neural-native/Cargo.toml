[package]
name = "magna-urbis-neural-native"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[workspace]

[[bin]]
name = "magna-urbis-neural"
path = "src/main.rs"

[dependencies]
neural_runtime = { package = "neural-earth-wasm", path = "../../../../infinite_map/native/neural-earth" }
magna-urbis-core = { path = "../core" }
serde_json = "1"
pollster = "0.4"
half = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = "thin"
