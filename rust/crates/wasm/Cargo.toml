[package]
name = "magna-urbis-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
magna-urbis-core = { path = "../core" }
wasm-bindgen = "0.2"
serde_json = "1"
wasm-bindgen-rayon = { version = "1.3", optional = true }

[features]
# Shared-memory build (pkg/wasm-threads): rayon in core, worker pool started
# from JS with `initThreadPool(n)`. Needs +atomics,+bulk-memory and build-std.
threads = ["magna-urbis-core/threads", "dep:wasm-bindgen-rayon"]

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false
