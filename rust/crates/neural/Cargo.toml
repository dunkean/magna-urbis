[package]
name = "magna-urbis-neural"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
magna-urbis-core = { path = "../core" }
half = "2"
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
burn = { version = "0.22", default-features = false, features = ["std", "wgpu", "vulkan", "autotune", "fusion"] }
png = "0.17"
pollster = "0.4"
env_logger = "0.11"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
burn = { version = "0.22", default-features = false, features = ["std", "webgpu", "autotune", "fusion"] }
