[package]
name = "magna-urbis-terrain"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# Terrain, erosion and hydrology: a leaf crate (no urban/settlements dependency),
# compiled once and rarely touched, so it keeps the optimised dev profile.
[dependencies]
magna-urbis-random = { path = "../random" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.12"
[target.'cfg(target_arch = "wasm32")'.dependencies]
rayon = { version = "1.12", optional = true }

[features]
threads = ["dep:rayon"]
