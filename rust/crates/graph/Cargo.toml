[package]
name = "magna-urbis-graph"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# Planar street graph: half-edges by level, lineage keys, dates, local operations,
# invariant checks and a spatial index. Kept from the abandoned growth engine to represent
# the connections of classic's streets later.
[dependencies]
magna-urbis-geom = { path = "../geom" }
serde = { version = "1", features = ["derive"] }
